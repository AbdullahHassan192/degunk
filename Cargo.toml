[package]
name = "degunk"
version = "0.1.0"
edition = "2021"
authors = ["Abdullah Hassan <abdullahch192@gmail.com>"]
description = "A fast, interactive dependency and build artifact cleaner"
license = "MIT"
repository = "https://github.com/AbdullahHassan192/degunk"
homepage = "https://github.com/AbdullahHassan192/degunk"
keywords = ["cleanup", "disk-space", "developer-tools", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
walkdir = "2.5"
rayon = "1.10"
trash = "5.2"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
